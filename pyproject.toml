[project]
name = "ddmo"
version = "2609.0"
description = "DDMO: Data-Driven Models for Optimization"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Ahmed H. Bayoumy", email = "ahmed.bayoumy@mail.mcgill.ca" }]
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0,<9.0",
]
# Sphinx 8 and the matching myst-parser need Python >= 3.10; the markers keep
# uv's universal resolution (which covers requires-python >= 3.9) satisfiable.
docs = [
    "furo>=2024.8.6; python_version >= '3.10'",
    "myst-parser>=3.0; python_version >= '3.10'",
    "sphinx>=8.0; python_version >= '3.10'",
    "sphinx-copybutton>=0.5.2; python_version >= '3.10'",
]
bench = [
    "matplotlib>=3.7",
    "pandas>=2.1",
]
ui = [
    "dash>=2.18",
    "pandas>=2.1",
    "plotly>=5.24",
]

[project.scripts]
ddmo-dashboard = "ddmo_frontend.app:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ddmo_frontend = ["assets/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
